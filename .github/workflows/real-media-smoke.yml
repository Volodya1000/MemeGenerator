name: Real meme media smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/02-curated-meme-assets
    paths:
      - .github/workflows/real-media-smoke.yml

permissions:
  contents: read

jobs:
  real-media-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: uv sync --extra dev
      - name: Download and normalize seven real clips
        run: uv run meme-assets --download --force
      - name: Record original media checksums (metadata only)
        run: sha256sum assets/raw/*.mp4
      - name: Verify output media and catalog (metadata only)
        shell: bash
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          sources = json.loads(Path('assets/sources.json').read_text())['clips']
          catalog = json.loads(Path('assets/catalog.json').read_text())
          assert len(sources) == len(catalog) == 7, 'expected exactly seven clips'
          identifiers = {clip['meme_id'] for clip in sources}
          assert {clip['meme_id'] for clip in catalog} == identifiers
          for clip in catalog:
              path = Path(clip['video_path'])
              assert path.is_file(), f'missing output: {path}'
              meta = subprocess.run(
                  ['ffprobe', '-v', 'error', '-show_entries',
                   'format=duration:stream=codec_type,codec_name,width,height',
                   '-of', 'json', str(path)],
                  check=True, capture_output=True, text=True,
              )
              details = json.loads(meta.stdout)
              streams = details['streams']
              video = next(s for s in streams if s['codec_type'] == 'video')
              audio = next(s for s in streams if s['codec_type'] == 'audio')
              assert (video['codec_name'], video['width'], video['height']) == ('h264', 1280, 720)
              assert audio['codec_name'] == 'aac'
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(clip['meme_id'], 'duration=', details['format']['duration'],
                    'bytes=', path.stat().st_size,
                    'sha256=', digest, flush=True)
          print('VERIFIED_REAL_CLIPS=7; media files retained only on ephemeral CI runner')
          PY
