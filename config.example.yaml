# Non-secret configuration; credentials belong in .env or environment.
planner: llm
llm:
  model: openai/qwen2.5-coder-14b-instruct
  api_base: http://localhost:11434/v1
  retry_attempts: 3
database:
  backend: json  # or sqlalchemy
scenes: 5
context_duration_seconds: 5  # Seconds to show the situation
catalog: assets/catalog.json
output: output/result.mp4
slide_mode: text_only  # text_only / image_only / image_with_caption
images: photos  # Auto-search Commons with readable card fallback
# Set images: local and image_dir: assets/context for offline images.
